name: MathFormula v4.5.1 Pre-close Capture QA Build
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  workflow_dispatch:
concurrency:
  group: mathformula-v451-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare stable keystore only when GitHub secrets are configured
        env:
          SIGNING_KEY_B64: ${{ secrets.MATHFORMULA_RELEASE_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.MATHFORMULA_RELEASE_PASSWORD }}
        run: |
          if [[ -n "$SIGNING_KEY_B64" && -n "$SIGNING_PASSWORD" ]]; then
            umask 077
            printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$RUNNER_TEMP/mathformula-release.p12"
            echo "MATHFORMULA_RELEASE_KEYSTORE=$RUNNER_TEMP/mathformula-release.p12" >> "$GITHUB_ENV"
            echo "STABLE_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
          else
            echo "STABLE_SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "Signing secrets missing. Building unsigned release for local signing only."
          fi
      - name: Compile release
        env:
          MATHFORMULA_RELEASE_PASSWORD: ${{ secrets.MATHFORMULA_RELEASE_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Verify debug APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK for Android QA (not a production upgrade)
        uses: actions/upload-artifact@v4
        with:
          name: MathFormula-v4.5.1-DEBUG-QA
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Stage APK
        run: |
          if [[ "$STABLE_SIGNING_CONFIGURED" == "true" ]]; then
            cp app/build/outputs/apk/release/app-release.apk MathFormula-v4.5.1-Stable.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk MathFormula-v4.5.1-UNSIGNED.apk
          fi
      - name: Upload stable signed release APK
        if: env.STABLE_SIGNING_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MathFormula-v4.5.1-Stable
          path: MathFormula-v4.5.1-Stable.apk
          if-no-files-found: error
      - name: Upload unsigned release for secure offline signing
        if: env.STABLE_SIGNING_CONFIGURED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MathFormula-v4.5.1-UNSIGNED
          path: MathFormula-v4.5.1-UNSIGNED.apk
          if-no-files-found: error
      - name: Stage Android SDK signing utility for local signing
        if: env.STABLE_SIGNING_CONFIGURED != 'true'
        run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
      - name: Upload Android signing utility
        if: env.STABLE_SIGNING_CONFIGURED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MathFormula-v4.5.1-apksigner
          path: apksigner.jar
          if-no-files-found: error
      - name: Publish major release candidate (signed or explicitly debug-signed)
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/v451-core-reliability-20261019'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$STABLE_SIGNING_CONFIGURED" == "true" ]]; then
            ASSET="MathFormula-v4.5.1-Stable.apk"
            NOTES="Read-only QA reliability build; optional backend not deployed; full 30-factor BUY signals not enabled. Release signing available. Never places orders. Alpha-40 BUY blocked until complete evidence."
          else
            ASSET="MathFormula-v4.5.1-Debug-Signed.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "$ASSET"
            NOTES="Read-only Groww-connected major release candidate. DEBUG-SIGNED TEST BUILD because stable keystore is not configured. Not a production-signed upgrade. No paper trades, no order placement. Do not treat missing factor scores as verified."
          fi
          if gh release view v4.5.1-qa1 >/dev/null 2>&1; then
            gh release edit v4.5.1-qa1 --target "$GITHUB_SHA" --prerelease --title "MathFormula v4.5.1 - QA Reliability Fixes"
          else
            gh release create v4.5.1-qa1 --target "$GITHUB_SHA" --prerelease \
              --title "MathFormula v4.5.1 - Pre-close QA Reliability Fixes" --notes "$NOTES"
          fi
          gh release upload v4.5.1-qa1 "$ASSET" --clobber
