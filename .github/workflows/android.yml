name: MathFormula stable Android release
on:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
concurrency:
  group: mathformula-v24-${{ github.sha }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare stable keystore only when GitHub secrets are configured
        env:
          SIGNING_KEY_B64: ${{ secrets.MATHFORMULA_RELEASE_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.MATHFORMULA_RELEASE_PASSWORD }}
        run: |
          if [[ -n "$SIGNING_KEY_B64" && -n "$SIGNING_PASSWORD" ]]; then
            umask 077
            printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$RUNNER_TEMP/mathformula-release.p12"
            echo "MATHFORMULA_RELEASE_KEYSTORE=$RUNNER_TEMP/mathformula-release.p12" >> "$GITHUB_ENV"
            echo "STABLE_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
          else
            echo "STABLE_SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "Signing secrets missing. Building unsigned release for local signing only."
          fi
      - name: Compile release
        env:
          MATHFORMULA_RELEASE_PASSWORD: ${{ secrets.MATHFORMULA_RELEASE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Stage APK
        run: |
          if [[ "$STABLE_SIGNING_CONFIGURED" == "true" ]]; then
            cp app/build/outputs/apk/release/app-release.apk MathFormula-v2.4.0-Stable.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk MathFormula-v2.4.0-UNSIGNED.apk
          fi
      - name: Upload stable signed release APK
        if: env.STABLE_SIGNING_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MathFormula-v2.4.0-Stable
          path: MathFormula-v2.4.0-Stable.apk
          if-no-files-found: error
      - name: Upload unsigned release for secure offline signing
        if: env.STABLE_SIGNING_CONFIGURED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MathFormula-v2.4.0-UNSIGNED
          path: MathFormula-v2.4.0-UNSIGNED.apk
          if-no-files-found: error
      - name: Publish signed release only
        if: env.STABLE_SIGNING_CONFIGURED == 'true' && github.ref == 'refs/heads/feat/stable-release-v24'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.4.0 >/dev/null 2>&1; then
            gh release edit v2.4.0 --target "$GITHUB_SHA" --title "MathFormula v2.4 stable-signing baseline"
          else
            gh release create v2.4.0 --target "$GITHUB_SHA" \
              --title "MathFormula v2.4 stable-signing baseline" \
              --notes "Persistent Android package and signing identity. Signer certificate must match subsequent updates."
          fi
          gh release upload v2.4.0 MathFormula-v2.4.0-Stable.apk --clobber
